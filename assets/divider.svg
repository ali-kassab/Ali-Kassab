<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155" stop-opacity="0"/><stop offset=".5" stop-color="#334155"/><stop offset="1" stop-color="#334155" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .beam { animation: travel 7s ease-in-out infinite; }
      @keyframes travel { 0% { transform: translateX(-260px); } 100% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#base)"/>
  <rect class="beam" x="0" y="11" width="240" height="2" fill="url(#beam)"/>
  <rect x="594" y="6" width="12" height="12" rx="2" transform="rotate(45 600 12)" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
</svg>
