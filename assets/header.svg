<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ali Abdelaal Mohamed - Backend Software Engineer</title>
  <desc id="d">Banner with the name, role and an animated diagram of backend services: API, auth, database, cache and real-time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#131A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
      .flow.slow { animation-duration: 2.6s; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: .6s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 1.8s; } .d4 { animation-delay: 2.4s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .fade { animation: fadein 1.2s ease-out both; }
      .fade2 { animation: fadein 1.2s .35s ease-out both; }
      .fade3 { animation: fadein 1.2s .7s ease-out both; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>

  <!-- left: identity -->
  <g class="fade">
    <text x="64" y="92" class="mono" font-size="17" fill="#22D3EE">// backend software engineer</text>
  </g>
  <g class="fade2">
    <text x="62" y="150" class="sans" font-size="50" font-weight="700" fill="#F8FAFC">Ali Abdelaal Mohamed</text>
    <text x="64" y="192" class="sans" font-size="23" fill="#CBD5E1">Node.js · NestJS · Java · Spring Boot · <tspan fill="#94A3B8">ASP.NET Core</tspan></text>
  </g>
  <g class="fade3">
    <rect x="64" y="224" width="560" height="44" rx="10" fill="#0F172A" stroke="#1E293B"/>
    <text x="84" y="252" class="mono" font-size="16" fill="#94A3B8"><tspan fill="#8B5CF6">$</tspan> build --reliable-apis --multi-tenant --realtime</text>
    <rect x="590" y="238" width="9" height="18" fill="#22D3EE" class="cursor"/>
  </g>

  <!-- right: service diagram -->
  <g fill="none" stroke-width="2">
    <path d="M760 160 H860" stroke="#22D3EE" class="flow"/>
    <path d="M940 160 C980 160 980 92 1020 92" stroke="#22D3EE" class="flow"/>
    <path d="M940 160 C980 160 980 228 1020 228" stroke="#8B5CF6" class="flow slow"/>
    <path d="M900 136 V84" stroke="#8B5CF6" class="flow slow"/>
    <path d="M900 184 V236" stroke="#22D3EE" class="flow slow"/>
  </g>
  <g class="mono" font-size="13" text-anchor="middle">
    <g>
      <rect x="680" y="138" width="80" height="44" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="720" y="165" fill="#CBD5E1">client</text>
    </g>
    <g>
      <rect x="860" y="136" width="80" height="48" rx="12" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
      <text x="900" y="165" fill="#F8FAFC" font-weight="700">api</text>
    </g>
    <g>
      <rect x="860" y="48" width="80" height="36" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="900" y="71" fill="#CBD5E1">auth</text>
    </g>
    <g>
      <rect x="860" y="236" width="80" height="36" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="900" y="259" fill="#CBD5E1">realtime</text>
    </g>
    <g>
      <rect x="1020" y="74" width="96" height="36" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="1068" y="97" fill="#CBD5E1">postgres</text>
    </g>
    <g>
      <rect x="1020" y="210" width="96" height="36" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="1068" y="233" fill="#CBD5E1">redis</text>
    </g>
  </g>
  <g>
    <circle cx="760" cy="160" r="4" fill="#22D3EE" class="pulse"/>
    <circle cx="900" cy="84" r="4" fill="#8B5CF6" class="pulse d1"/>
    <circle cx="1020" cy="92" r="4" fill="#22D3EE" class="pulse d2"/>
    <circle cx="1020" cy="228" r="4" fill="#8B5CF6" class="pulse d3"/>
    <circle cx="900" cy="236" r="4" fill="#22D3EE" class="pulse d4"/>
  </g>
</svg>
