<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="t">
  <title id="t">Thanks for stopping by — let's build reliable backends.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="119" rx="18" fill="url(#bg)" stroke="#1E293B"/>
  <text x="600" y="56" text-anchor="middle" class="sans" font-size="26" font-weight="600" fill="url(#accent)">Thanks for stopping by — let's build reliable backends.</text>
  <text x="600" y="90" text-anchor="middle" class="mono" font-size="15" fill="#94A3B8">$ git commit -m "say hello"<tspan class="cursor" fill="#2DD4BF"> ▍</tspan></text>
</svg>
