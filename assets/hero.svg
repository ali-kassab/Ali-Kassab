<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Ali Abdelaal Mohamed — Backend Software Engineer</title>
  <desc id="d">Header banner with name, role and core stack (Node.js, NestJS, Java, Spring Boot, ASP.NET Core), beside an animated diagram of a request moving from a client through a REST API to services and data stores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5"><stop offset="0" stop-color="#818CF8" stop-opacity="0.18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .in  { animation: rise .9s ease-out both; }
      .in2 { animation: rise .9s .2s ease-out both; }
      .in3 { animation: rise .9s .4s ease-out both; }
      .in4 { animation: rise .9s .6s ease-out both; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .flow { stroke-dasharray: 5 9; animation: flow 1.4s linear infinite; }
      .dot { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect y="0" width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#1E293B"/>
  <g class="in">
    <text x="64" y="84" class="mono" font-size="17" fill="#94A3B8" textLength="214" lengthAdjust="spacingAndGlyphs"><tspan fill="#2DD4BF">~/ali-kassab</tspan> $ whoami</text>
    <rect class="cursor" x="286" y="70" width="9" height="18" fill="#2DD4BF"/>
  </g>
  <text class="sans in2" x="62" y="150" font-size="54" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Ali Abdelaal Mohamed</text>
  <text class="sans in3" x="64" y="196" font-size="29" font-weight="600" fill="url(#accent)">Backend Software Engineer</text>
  <g class="in4">
    <text x="64" y="240" class="mono" font-size="17" fill="#CBD5E1">Node.js · NestJS · Express · Java · Spring Boot · ASP.NET Core</text>
    <text x="64" y="290" class="sans" font-size="16" fill="#94A3B8"><tspan fill="#2DD4BF">●</tspan>  Software Engineer @ DevGlobal LLC    <tspan fill="#818CF8">◆</tspan>  Giza, Egypt</text>
  </g>
  <g class="in3">
    <text x="712" y="56" class="mono" font-size="13" fill="#94A3B8" letter-spacing="1">CLIENT → API → SERVICES → DATA</text>
    <g fill="none" stroke="#334155" stroke-width="2"><path d="M816 172 H856"/><path d="M968 172 H990 V98 H1012"/><path d="M968 172 H1012"/><path d="M968 172 H990 V246 H1012"/><path d="M912 194 V262"/></g>
    <g fill="none" stroke="#2DD4BF" stroke-opacity=".55" stroke-width="2" class="flow"><path d="M816 172 H856"/><path d="M968 172 H990 V98 H1012"/><path d="M968 172 H1012"/><path d="M968 172 H990 V246 H1012"/><path d="M912 194 V262"/></g>
    <circle r="3.5" fill="#2DD4BF">
      <animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M816 172 H856"/>
    </circle>
    <circle r="3.5" fill="#818CF8">
      <animateMotion dur="2.4s" begin="0.45s" repeatCount="indefinite" path="M968 172 H990 V98 H1012"/>
    </circle>
    <circle r="3.5" fill="#2DD4BF">
      <animateMotion dur="2.4s" begin="0.90s" repeatCount="indefinite" path="M968 172 H1012"/>
    </circle>
    <circle r="3.5" fill="#818CF8">
      <animateMotion dur="2.4s" begin="1.35s" repeatCount="indefinite" path="M968 172 H990 V246 H1012"/>
    </circle>
    <circle r="3.5" fill="#2DD4BF">
      <animateMotion dur="2.4s" begin="1.80s" repeatCount="indefinite" path="M912 194 V262"/>
    </circle>
    <g>
      <rect x="712" y="150" width="104" height="44" rx="10" fill="#111A2E" stroke="#334155"/>
      <circle class="dot" style="animation-delay:0s" cx="728" cy="172" r="4" fill="#2DD4BF"/>
      <text x="742" y="177" class="mono" font-size="15" fill="#CBD5E1">client</text>
    </g>
    <g>
      <rect x="856" y="150" width="112" height="44" rx="10" fill="#111A2E" stroke="#334155"/>
      <circle class="dot" style="animation-delay:0.4s" cx="872" cy="172" r="4" fill="#2DD4BF"/>
      <text x="886" y="177" class="mono" font-size="15" fill="#CBD5E1">REST API</text>
    </g>
    <g>
      <rect x="1012" y="78" width="136" height="40" rx="10" fill="#111A2E" stroke="#334155"/>
      <circle class="dot" style="animation-delay:0.8s" cx="1028" cy="98" r="4" fill="#2DD4BF"/>
      <text x="1042" y="103" class="mono" font-size="15" fill="#CBD5E1">auth · RBAC</text>
    </g>
    <g>
      <rect x="1012" y="152" width="136" height="40" rx="10" fill="#111A2E" stroke="#334155"/>
      <circle class="dot" style="animation-delay:1.2s" cx="1028" cy="172" r="4" fill="#2DD4BF"/>
      <text x="1042" y="177" class="mono" font-size="15" fill="#CBD5E1">domain</text>
    </g>
    <g>
      <rect x="1012" y="226" width="136" height="40" rx="10" fill="#111A2E" stroke="#334155"/>
      <circle class="dot" style="animation-delay:1.6s" cx="1028" cy="246" r="4" fill="#2DD4BF"/>
      <text x="1042" y="251" class="mono" font-size="15" fill="#CBD5E1">realtime</text>
    </g>
    <g>
      <rect x="840" y="262" width="144" height="40" rx="10" fill="#111A2E" stroke="#334155"/>
      <circle class="dot" style="animation-delay:2s" cx="856" cy="282" r="4" fill="#2DD4BF"/>
      <text x="870" y="287" class="mono" font-size="15" fill="#CBD5E1">SQL · Redis</text>
    </g>
  </g>
</svg>
