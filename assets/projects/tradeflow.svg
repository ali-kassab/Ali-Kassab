<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="t">
  <title id="t">TradeFlow — Bilingual B2B wholesale management (NestJS · TypeScript · Prisma · SQL Server · React)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#FB7185" stop-opacity=".35"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB7185" stop-opacity="0"/><stop offset=".5" stop-color="#FB7185"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="160" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .shine { animation: sweep 6s ease-in-out infinite; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px); } 60%, 100% { transform: translateX(1200px); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="160" fill="url(#bg)"/>
    <rect width="1200" height="3" fill="#FB7185" fill-opacity=".25"/>
    <rect class="shine" width="300" height="3" fill="url(#shine)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="159" rx="17.5" fill="none" stroke="#1E293B"/>
  <rect x="36" y="34" width="92" height="92" rx="20" fill="url(#mark)" fill-opacity=".18" stroke="#FB7185" stroke-opacity=".6"/>
  <text x="82" y="93" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#FB7185">TF</text>
  <text x="156" y="70" class="sans" font-size="40" font-weight="700" fill="#F8FAFC">TradeFlow</text>
  <text x="158" y="106" class="sans" font-size="23" fill="#CBD5E1">Bilingual B2B wholesale management</text>
  <text x="158" y="136" class="mono" font-size="16" fill="#94A3B8">NestJS · TypeScript · Prisma · SQL Server · React</text>
  <g transform="translate(1095.2 34)">
    <rect width="68.8" height="32" rx="16" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-opacity=".55"/>
    <circle class="dot" cx="17" cy="16" r="4" fill="#2DD4BF"/>
    <text x="30" y="21" class="mono" font-size="14" font-weight="700" fill="#2DD4BF" letter-spacing="1">MVP</text>
  </g>
  <text x="1164" y="136" text-anchor="end" class="mono" font-size="15" fill="#FB7185">view repository →</text>
</svg>
